<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="data:application/json,{
        &quot;name&quot;:&quot;BTC Tracker&quot;,
        &quot;short_name&quot;:&quot;BTC&quot;,
        &quot;display&quot;:&quot;standalone&quot;,
        &quot;start_url&quot;:&quot;.&quot;,
        &quot;background_color&quot;:&quot;#1a1a2e&quot;,
        &quot;theme_color&quot;:&quot;#f7931a&quot;
    }">
    <title>BTC Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            color: #fff;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(90deg, #f7931a, #f8b84a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .update-btn {
            background: linear-gradient(135deg, #f7931a, #f8b84a);
            border: none;
            color: #1a1a2e;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(247, 147, 26, 0.3);
            touch-action: manipulation;
            white-space: nowrap;
        }

        .update-btn:active {
            transform: scale(0.95);
        }

        .update-btn:disabled {
            opacity: 0.6;
            transform: scale(0.98);
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(26, 26, 46, 0.3);
            border-radius: 50%;
            border-top-color: #1a1a2e;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .price-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .price-card:last-child {
            margin-bottom: 16px;
        }

        .currency-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .currency-name {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }

        .ath-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .ath-value {
            color: #f7931a;
            font-weight: 600;
        }

        .current-price {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin: 4px 0 6px 0;
        }

        .ratio-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 8px;
            margin-top: 4px;
        }

        .ratio-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }

        .ratio-value {
            font-size: 16px;
            font-weight: 700;
            color: #f8b84a;
        }

        .ratio-value.high {
            color: #4ecdc4;
        }

        .ratio-value.medium {
            color: #f8b84a;
        }

        .ratio-value.low {
            color: #ff6b6b;
        }

        .last-updated {
            text-align: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 12px;
        }

        .error-message {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.2);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
            color: #ff6b6b;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>₿ BTC Tracker</h1>
            <button class="update-btn" id="updateBtn" onclick="updatePrices()">
                <span id="btnText">⟳ Update</span>
            </button>
        </div>

        <div class="error-message" id="errorMsg">
            ⚠️ Fehler beim Laden. Bitte erneut versuchen.
        </div>

        <div id="priceContainer"></div>

        <div class="last-updated" id="lastUpdated">Letztes Update: –</div>
    </div>

    <script>
        const CURRENCIES = ['eur', 'usd', 'gbp', 'jpy', 'chf'];
        const CURRENCY_SYMBOLS = {
            eur: '€',
            usd: '$',
            gbp: '£',
            jpy: '¥',
            chf: 'Fr.'
        };
        const CURRENCY_NAMES = {
            eur: 'Euro',
            usd: 'US Dollar',
            gbp: 'Pfund Sterling',
            jpy: 'Japanischer Yen',
            chf: 'Schweizer Franken'
        };

        const priceContainer = document.getElementById('priceContainer');
        const lastUpdatedElement = document.getElementById('lastUpdated');
        const errorMsg = document.getElementById('errorMsg');
        const updateBtn = document.getElementById('updateBtn');
        const btnText = document.getElementById('btnText');

        async function updatePrices() {
            updateBtn.disabled = true;
            btnText.innerHTML = '<span class="loading-spinner"></span>';
            errorMsg.classList.remove('show');

            try {
                const response = await fetch(
                    'https://api.coingecko.com/api/v3/coins/bitcoin?localization=false&tickers=false&market_data=true',
                    { headers: { 'Accept': 'application/json' } }
                );

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                const marketData = data.market_data;

                let html = '';
                const priceData = {};

                CURRENCIES.forEach(currency => {
                    const ath = marketData.ath[currency];
                    const current = marketData.current_price[currency];
                    const ratio = (ath / current).toFixed(3);

                    priceData[currency] = { ath, current, ratio };

                    // Ratio color coding
                    let ratioClass = 'medium';
                    if (ratio > 2.5) ratioClass = 'high';
                    else if (ratio < 1.5) ratioClass = 'low';

                    html += `
                        <div class="price-card">
                            <div class="currency-header">
                                <span class="currency-name">${CURRENCY_NAMES[currency]}</span>
                                <span class="ath-label">ATH: <span class="ath-value">${formatCurrency(ath, currency)}</span></span>
                            </div>
                            <div class="current-price">${formatCurrency(current, currency)}</div>
                            <div class="ratio-row">
                                <span class="ratio-label">📊 ATH / Current Ratio</span>
                                <span class="ratio-value ${ratioClass}">${ratio}</span>
                            </div>
                        </div>
                    `;
                });

                priceContainer.innerHTML = html;

                // Cache data
                try {
                    localStorage.setItem('btcPrices', JSON.stringify({
                        data: priceData,
                        timestamp: new Date().toISOString()
                    }));
                } catch (e) {}

                const now = new Date();
                lastUpdatedElement.textContent = `Letztes Update: ${now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;

            } catch (error) {
                console.error('Error:', error);
                errorMsg.classList.add('show');

                // Load from cache
                try {
                    const cached = localStorage.getItem('btcPrices');
                    if (cached) {
                        const data = JSON.parse(cached);
                        displayCachedData(data);
                        lastUpdatedElement.textContent = `⚠️ Offline (${new Date(data.timestamp).toLocaleTimeString('de-DE')})`;
                    }
                } catch (e) {}
            } finally {
                updateBtn.disabled = false;
                btnText.textContent = '⟳ Update';
            }
        }

        function displayCachedData(data) {
            if (!data.data) return;

            let html = '';
            CURRENCIES.forEach(currency => {
                const info = data.data[currency];
                if (info) {
                    let ratioClass = 'medium';
                    if (info.ratio > 2.5) ratioClass = 'high';
                    else if (info.ratio < 1.5) ratioClass = 'low';

                    html += `
                        <div class="price-card">
                            <div class="currency-header">
                                <span class="currency-name">${CURRENCY_NAMES[currency]}</span>
                                <span class="ath-label">ATH: <span class="ath-value">${formatCurrency(info.ath, currency)}</span></span>
                            </div>
                            <div class="current-price">${formatCurrency(info.current, currency)}</div>
                            <div class="ratio-row">
                                <span class="ratio-label">📊 ATH / Current Ratio</span>
                                <span class="ratio-value ${ratioClass}">${info.ratio}</span>
                            </div>
                        </div>
                    `;
                }
            });
            if (html) priceContainer.innerHTML = html;
        }

        function formatCurrency(value, currency) {
            if (value === undefined || value === null) return '–';
            const symbol = CURRENCY_SYMBOLS[currency] || currency.toUpperCase();
            return `${symbol} ${value.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        // Load cached data
        try {
            const cached = localStorage.getItem('btcPrices');
            if (cached) {
                const data = JSON.parse(cached);
                displayCachedData(data);
                lastUpdatedElement.textContent = `Letztes Update: ${new Date(data.timestamp).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })} (gespeichert)`;
            }
        } catch (e) {}

        updatePrices();
        setInterval(updatePrices, 60000);
    </script>
</body>
</html>
