<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="data:application/json,{
        &quot;name&quot;:&quot;BTC Tracker&quot;,
        &quot;short_name&quot;:&quot;BTC&quot;,
        &quot;display&quot;:&quot;standalone&quot;,
        &quot;start_url&quot;:&quot;.&quot;,
        &quot;background_color&quot;:&quot;#1a1a2e&quot;,
        &quot;theme_color&quot;:&quot;#f7931a&quot;
    }">
    <title>BTC Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            color: #fff;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, #f7931a, #f8b84a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .update-btn {
            background: linear-gradient(135deg, #f7931a, #f8b84a);
            border: none;
            color: #1a1a2e;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(247, 147, 26, 0.3);
            touch-action: manipulation;
        }

        .update-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(247, 147, 26, 0.2);
        }

        .update-btn:disabled {
            opacity: 0.6;
            transform: scale(0.98);
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(26, 26, 46, 0.3);
            border-radius: 50%;
            border-top-color: #1a1a2e;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .price-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .price-card:last-child {
            margin-bottom: 20px;
        }

        .currency-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .currency-value {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .ath-value {
            color: #f7931a;
        }

        .ratio-box {
            background: rgba(247, 147, 26, 0.1);
            border: 1px solid rgba(247, 147, 26, 0.2);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }

        .ratio-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 4px;
        }

        .ratio-value {
            font-size: 28px;
            font-weight: 700;
            color: #f7931a;
        }

        .last-updated {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 16px;
        }

        .error-message {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.2);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
            color: #ff6b6b;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>₿ BTC Tracker</h1>
            <button class="update-btn" id="updateBtn" onclick="updatePrices()">
                <span id="btnText">⟳ Aktualisieren</span>
            </button>
        </div>

        <div class="error-message" id="errorMsg">
            ⚠️ Fehler beim Laden der Daten. Bitte versuche es erneut.
        </div>

        <div id="priceContainer"></div>

        <div class="ratio-box">
            <div class="ratio-label">📊 ATH / Current Ratio</div>
            <div class="ratio-value" id="ratio">–</div>
        </div>

        <div class="last-updated" id="lastUpdated">Letztes Update: –</div>
    </div>

    <script>
        const CURRENCIES = ['eur', 'usd', 'gbp', 'jpy', 'chf'];
        const CURRENCY_SYMBOLS = {
            eur: '€',
            usd: '$',
            gbp: '£',
            jpy: '¥',
            chf: 'Fr.'
        };

        const priceContainer = document.getElementById('priceContainer');
        const ratioElement = document.getElementById('ratio');
        const lastUpdatedElement = document.getElementById('lastUpdated');
        const errorMsg = document.getElementById('errorMsg');
        const updateBtn = document.getElementById('updateBtn');
        const btnText = document.getElementById('btnText');

        let currentPrices = null;

        async function updatePrices() {
            // Disable button and show loading
            updateBtn.disabled = true;
            btnText.innerHTML = '<span class="loading-spinner"></span> Laden...';
            errorMsg.classList.remove('show');

            try {
                const response = await fetch(
                    'https://api.coingecko.com/api/v3/coins/bitcoin?localization=false&tickers=false&market_data=true',
                    { headers: { 'Accept': 'application/json' } }
                );

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                const marketData = data.market_data;

                // Store prices
                currentPrices = {
                    ath: {},
                    current: {}
                };

                let html = '';
                let athTotal = 0;
                let currentTotal = 0;

                CURRENCIES.forEach(currency => {
                    const ath = marketData.ath[currency];
                    const current = marketData.current_price[currency];

                    currentPrices.ath[currency] = ath;
                    currentPrices.current[currency] = current;

                    athTotal += ath;
                    currentTotal += current;

                    html += `
                        <div class="price-card">
                            <div class="currency-label">
                                <span>${currency.toUpperCase()}</span>
                                <span>ATH: <strong class="ath-value">${formatCurrency(ath, currency)}</strong></span>
                            </div>
                            <div class="currency-value">${formatCurrency(current, currency)}</div>
                        </div>
                    `;
                });

                priceContainer.innerHTML = html;

                // Calculate ratio based on average
                const avgRatio = (athTotal / currentTotal).toFixed(3);
                ratioElement.textContent = avgRatio;

                // Update timestamp
                const now = new Date();
                lastUpdatedElement.textContent = `Letztes Update: ${now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;

                // Cache in localStorage for offline use
                try {
                    localStorage.setItem('btcPrices', JSON.stringify({
                        prices: currentPrices,
                        ratio: avgRatio,
                        timestamp: now.toISOString()
                    }));
                } catch (e) {
                    // Ignore localStorage errors
                }

            } catch (error) {
                console.error('Error fetching prices:', error);
                errorMsg.classList.add('show');

                // Try to load from cache
                try {
                    const cached = localStorage.getItem('btcPrices');
                    if (cached) {
                        const data = JSON.parse(cached);
                        displayCachedData(data);
                        lastUpdatedElement.textContent = `⚠️ Offline-Modus (${new Date(data.timestamp).toLocaleTimeString('de-DE')})`;
                    }
                } catch (e) {
                    // Ignore cache errors
                }
            } finally {
                // Re-enable button
                updateBtn.disabled = false;
                btnText.textContent = '⟳ Aktualisieren';
            }
        }

        function displayCachedData(data) {
            if (!data.prices) return;

            let html = '';
            CURRENCIES.forEach(currency => {
                const ath = data.prices.ath[currency];
                const current = data.prices.current[currency];
                if (ath && current) {
                    html += `
                        <div class="price-card">
                            <div class="currency-label">
                                <span>${currency.toUpperCase()}</span>
                                <span>ATH: <strong class="ath-value">${formatCurrency(ath, currency)}</strong></span>
                            </div>
                            <div class="currency-value">${formatCurrency(current, currency)}</div>
                        </div>
                    `;
                }
            });
            if (html) {
                priceContainer.innerHTML = html;
                ratioElement.textContent = data.ratio || '–';
            }
        }

        function formatCurrency(value, currency) {
            if (value === undefined || value === null) return '–';
            const symbol = CURRENCY_SYMBOLS[currency] || currency.toUpperCase();
            return `${symbol} ${value.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        // Load cached data immediately
        try {
            const cached = localStorage.getItem('btcPrices');
            if (cached) {
                const data = JSON.parse(cached);
                displayCachedData(data);
                lastUpdatedElement.textContent = `Letztes Update: ${new Date(data.timestamp).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })} (gespeichert)`;
            }
        } catch (e) {
            // Ignore cache errors
        }

        // Auto-update on load
        updatePrices();

        // Update every 60 seconds
        setInterval(updatePrices, 60000);
    </script>
</body>
</html>
